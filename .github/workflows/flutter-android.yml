name: Flutter app

on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/flutter-android.yml']
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/flutter-android.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  verify:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
        env:
          TZ: America/Los_Angeles
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: ignore

  android:
    name: Android APK and App Bundle
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Release signing only when the secrets exist; otherwise Gradle falls
      # back to the debug key (see android/app/build.gradle.kts).
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: somna-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: somna-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: iOS build (unsigned)
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - run: cd build/ios/iphoneos && zip -qr ../../../somna-ios-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: somna-ios-unsigned
          path: mobile/somna-ios-unsigned.zip
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/somna-apk/app-release.apk
            dist/somna-aab/app-release.aab
            dist/somna-ios-unsigned/somna-ios-unsigned.zip
