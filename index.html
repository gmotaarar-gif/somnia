<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080809" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Somna — трекер сна и психического состояния" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <script>
      // Set the theme before first paint so a light-theme launch does not flash dark.
      try {
        var m = (JSON.parse(localStorage.getItem("somna-state-v6") || "{}") || {}).theme
        var light = m === "light" || (m !== "dark" && matchMedia("(prefers-color-scheme: light)").matches)
        var theme = light ? "light" : "dark"
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = light ? "#f2f1f6" : "#080809"
        document.querySelector('meta[name="color-scheme"]').content = theme
      } catch (e) {}
    </script>
    <title>Somna — сон и состояние</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
