<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070c" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Somna — трекер сна и психического состояния" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2307070c'/%3E%3Ccircle cx='30' cy='34' r='17' fill='%23d9f24a'/%3E%3Ccircle cx='39' cy='27' r='15' fill='%2307070c'/%3E%3C/svg%3E" />
    <script>
      // Set the theme before first paint so a light-theme launch does not flash dark.
      try {
        var m = (JSON.parse(localStorage.getItem("somna-state-v6") || "{}") || {}).theme
        var light = m === "light" || (m !== "dark" && matchMedia("(prefers-color-scheme: light)").matches)
        document.documentElement.dataset.theme = light ? "light" : "dark"
      } catch (e) {}
    </script>
    <title>Somna — сон и состояние</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
